services:
  - type: web
    name: ledger-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: AUTO_TRACK_KEY
        generateValue: true
      - key: APP_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      # TURSO_URL and TURSO_AUTH_TOKEN must be configured securely
      # in the Render dashboard environment variables (never committed to repository).
    disk:
      name: ledger-data
      mountPath: /var/data
      sizeGB: 1
