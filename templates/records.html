{% extends layout|default('base.html') %}
{% block title %}历史记录 - 我的记账本{% endblock %}
{% block content %}
<h2>历史记录</h2>

<form method="get" class="filters">
  <label>开始日期 <input type="date" name="start" value="{{ start }}"></label>
  <label>结束日期 <input type="date" name="end" value="{{ end }}"></label>
  <label>类型
    <select name="type">
      <option value="">全部</option>
      <option value="income" {{ 'selected' if type=='income' }}>收入</option>
      <option value="expense" {{ 'selected' if type=='expense' }}>支出</option>
      <option value="savings" {{ 'selected' if type=='savings' }}>储蓄</option>
    </select>
  </label>
  <label>分类
    <select name="category">
      <option value="">全部</option>
      {% for c in categories %}
      <option value="{{ c }}" {{ 'selected' if category==c }}>{{ c }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit" class="btn-primary">筛选</button>
  <a href="{{ url_for('records') }}" class="btn-ghost">重置</a>
</form>

<form method="post" action="{{ url_for('batch_delete_records') }}" id="batchForm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <!-- 批量操作控制栏 -->
  <div class="batch-bar" id="batchBar" style="display: none; align-items: center; justify-content: space-between; background: var(--surface-soft); padding: 10px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-bottom: 14px; flex-wrap: wrap; gap: 8px;">
    <div style="font-size: 14px; color: var(--ink-soft);">
      已选中 <strong id="selectedCount" style="color: var(--navy);">0</strong> 项记录
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button type="button" class="btn-ghost" onclick="clearAllSelections()" style="padding: 5px 12px; font-size: 13px;">取消选择</button>
      <button type="button" class="btn-secondary" id="batchEditBtn" onclick="openBatchEditDialog()" style="padding: 5px 14px; font-size: 13px;">批量修改分类/类型</button>
      <button type="button" class="btn-danger-solid" id="batchDeleteBtn" onclick="confirmBatchDelete()" style="padding: 5px 14px; font-size: 13px;">批量删除</button>
    </div>
  </div>

  <div id="recordsLiveContainer">
    {% include 'partials/records_content.html' %}
  </div>
</form>

<script>
window.ALL_CATEGORIES = {{ categories | tojson }};

function openBatchEditDialog() {
  const selected = document.querySelectorAll('.record-checkbox:checked');
  if (selected.length === 0) {
    if (typeof Swal !== 'undefined') {
      Swal.fire({ icon: 'info', title: '请先勾选需要批量修改的记录', timer: 1500, showConfirmButton: false });
    } else {
      alert('请先勾选需要批量修改的记录');
    }
    return;
  }

  const categories = window.ALL_CATEGORIES || [];
  let catOptions = '<option value="">保持原分类不变</option>';
  categories.forEach(c => {
    catOptions += '<option value="' + c + '">' + c + '</option>';
  });

  if (typeof Swal !== 'undefined') {
    Swal.fire({
      title: '批量修改选中的 ' + selected.length + ' 项记录',
      html: `
        <div style="text-align: left; display:flex; flex-direction:column; gap:12px; margin-top:8px;">
          <label style="font-size:13px; color:var(--ink); font-weight:600;">
            修改交易类型 (Type)：
            <select id="swalBatchType" class="swal2-input" style="margin:4px 0 0 0; width:100%; height:38px; font-size:13.5px; box-sizing:border-box;">
              <option value="">保持原类型不变</option>
              <option value="expense">支出 (Expense)</option>
              <option value="income">收入 (Income)</option>
              <option value="savings">结余储蓄 (Savings)</option>
            </select>
          </label>
          <div id="swalBatchGroupWrap" style="display:none;">
            <label style="font-size:13px; color:var(--ink); font-weight:600;">
              收入分组 (Group)：
              <select id="swalBatchGroup" class="swal2-input" style="margin:4px 0 0 0; width:100%; height:38px; font-size:13.5px; box-sizing:border-box;">
                <option value="main">主业收入</option>
                <option value="side">副业收入</option>
              </select>
            </label>
          </div>
          <label style="font-size:13px; color:var(--ink); font-weight:600;">
            修改分类 (Category)：
            <select id="swalBatchCategory" class="swal2-input" style="margin:4px 0 0 0; width:100%; height:38px; font-size:13.5px; box-sizing:border-box;">
              ${catOptions}
            </select>
          </label>
        </div>
      `,
      didOpen: () => {
        const typeSelect = document.getElementById('swalBatchType');
        const groupWrap = document.getElementById('swalBatchGroupWrap');
        if (typeSelect && groupWrap) {
          typeSelect.addEventListener('change', () => {
            groupWrap.style.display = (typeSelect.value === 'income') ? 'block' : 'none';
          });
        }
      },
      showCancelButton: true,
      confirmButtonText: '确认批量修改',
      cancelButtonText: '取消',
      buttonsStyling: false,
      customClass: {
        popup: 'app-swal-popup',
        title: 'app-swal-title',
        confirmButton: 'btn-primary',
        cancelButton: 'btn-ghost',
        actions: 'app-swal-actions'
      },
      preConfirm: () => {
        const newType = document.getElementById('swalBatchType').value;
        const groupName = document.getElementById('swalBatchGroup') ? document.getElementById('swalBatchGroup').value : '';
        const newCategory = document.getElementById('swalBatchCategory').value;
        if (!newType && !newCategory) {
          Swal.showValidationMessage('请至少选择一项要修改的类型或分类');
          return false;
        }
        return { type: newType, group_name: groupName, category: newCategory };
      }
    }).then(result => {
      if (result.isConfirmed && result.value) {
        if (typeof showProgressBar === 'function') showProgressBar();
        const formData = new FormData();
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '{{ csrf_token() }}';
        formData.append('csrf_token', csrfToken);
        selected.forEach(cb => formData.append('ids', cb.value));
        if (result.value.type) {
          formData.append('type', result.value.type);
          if (result.value.type === 'income' && result.value.group_name) {
            formData.append('group_name', result.value.group_name);
          }
        }
        if (result.value.category) {
          formData.append('category', result.value.category);
        }

        fetch('{{ url_for("batch_edit_records") }}', {
          method: 'POST',
          body: formData,
          headers: { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json' }
        })
        .then(r => r.json())
        .then(data => {
          if (typeof finishProgressBar === 'function') finishProgressBar();
          if (data.ok) {
            Swal.fire({
              toast: true,
              position: 'top-end',
              icon: 'success',
              title: data.message,
              showConfirmButton: false,
              timer: 2500,
              customClass: { popup: 'app-swal-toast' }
            });
            if (typeof htmx !== 'undefined') {
              htmx.ajax('GET', window.location.href, { target: '#mainContainer', swap: 'innerHTML' });
            } else {
              window.location.reload();
            }
          } else {
            errorAlert(data.message || '批量修改失败');
          }
        })
        .catch(() => {
          if (typeof finishProgressBar === 'function') finishProgressBar();
          errorAlert('网络连接异常，批量修改未完成');
        });
      }
    });
  }
}
function toggleSelectAll(master) {
  const checkboxes = document.querySelectorAll('.record-checkbox');
  checkboxes.forEach(cb => {
    cb.checked = master.checked;
    const row = cb.closest('tr');
    if (row) row.classList.toggle('selected-row', cb.checked);
  });
  updateBatchBar();
}

function updateBatchBar() {
  const batchBar = document.getElementById('batchBar');
  if (!batchBar) return;
  const selected = document.querySelectorAll('.record-checkbox:checked');
  const total = document.querySelectorAll('.record-checkbox');
  const selectAll = document.getElementById('selectAllCheckbox');
  const selectedCount = document.getElementById('selectedCount');

  if (selectAll && total.length > 0) {
    selectAll.checked = selected.length === total.length;
  }

  // 高亮行的背景
  document.querySelectorAll('.record-checkbox').forEach(cb => {
    const row = cb.closest('tr');
    if (row) row.classList.toggle('selected-row', cb.checked);
  });

  if (selected.length > 0) {
    batchBar.style.display = 'flex';
    if (selectedCount) selectedCount.textContent = selected.length;
  } else {
    batchBar.style.display = 'none';
  }
}

function clearAllSelections() {
  document.querySelectorAll('.record-checkbox').forEach(cb => {
    cb.checked = false;
    const row = cb.closest('tr');
    if (row) row.classList.remove('selected-row');
  });
  const selectAll = document.getElementById('selectAllCheckbox');
  if (selectAll) selectAll.checked = false;
  updateBatchBar();
}

function confirmBatchDelete() {
  const selected = document.querySelectorAll('.record-checkbox:checked');
  if (selected.length === 0) return;
  const count = selected.length;

  if (typeof Swal !== 'undefined') {
    Swal.fire({
      icon: 'warning',
      iconColor: '#a8475a',
      title: '批量删除确认',
      html: '确认为选中的 <b>' + count + '</b> 条记录进行删除操作吗？<br><span style="color:#8a877e;font-size:13px;">删除后提供 5 秒撤销恢复窗口。</span>',
      showCancelButton: true,
      reverseButtons: true,
      confirmButtonText: '确认删除',
      cancelButtonText: '取消',
      buttonsStyling: false,
      customClass: {
        popup: 'app-swal-popup',
        title: 'app-swal-title',
        htmlContainer: 'app-swal-html',
        confirmButton: 'btn-danger-solid',
        cancelButton: 'btn-ghost',
        actions: 'app-swal-actions'
      }
    }).then(function (result) {
      if (result.isConfirmed) {
        const rows = Array.from(selected).map(cb => cb.closest('tr')).filter(Boolean);
        rows.forEach(r => {
          r.style.opacity = '0.35';
          r.style.filter = 'grayscale(1)';
          r.style.pointerEvents = 'none';
        });
        const batchBar = document.getElementById('batchBar');
        if (batchBar) batchBar.style.display = 'none';

        let isUndone = false;
        Swal.fire({
          toast: true,
          position: 'bottom-end',
          icon: 'info',
          title: '已删除 ' + count + ' 条记录',
          html: '<span style="font-size:12px;color:var(--muted)">如需撤销请在 5 秒内点击</span>',
          timer: 5000,
          timerProgressBar: true,
          showConfirmButton: true,
          confirmButtonText: '撤销 (Undo)',
          buttonsStyling: false,
          customClass: {
            popup: 'app-swal-toast app-swal-undo-toast',
            confirmButton: 'btn-primary btn-sm'
          }
        }).then(function(res) {
          if (res.isConfirmed) {
            isUndone = true;
            rows.forEach(r => {
              r.style.opacity = '';
              r.style.filter = '';
              r.style.pointerEvents = '';
            });
            updateBatchBar();
            Swal.fire({
              toast: true,
              position: 'top-end',
              icon: 'success',
              title: '已撤销删除，记录已保留',
              showConfirmButton: false,
              timer: 2000
            });
          } else if (res.dismiss === Swal.DismissReason.timer || !isUndone) {
            if (typeof showProgressBar === 'function') showProgressBar();
            const form = document.getElementById('batchForm');
            const formData = new FormData(form);
            fetch('{{ url_for("batch_delete_records") }}', {
              method: 'POST',
              body: formData,
              headers: { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json' }
            })
            .then(r => r.json())
            .then(data => {
              if (typeof finishProgressBar === 'function') finishProgressBar();
              if (data.ok) {
                rows.forEach(r => r.remove());
                updateBatchBar();
                Swal.fire({
                  toast: true,
                  position: 'top-end',
                  icon: 'success',
                  title: data.message,
                  showConfirmButton: false,
                  timer: 2500,
                  customClass: { popup: 'app-swal-toast' }
                });
              } else {
                rows.forEach(r => {
                  r.style.opacity = '';
                  r.style.filter = '';
                  r.style.pointerEvents = '';
                });
                updateBatchBar();
                errorAlert(data.message || '批量删除失败');
              }
            })
            .catch(() => {
              if (typeof finishProgressBar === 'function') finishProgressBar();
              rows.forEach(r => {
                r.style.opacity = '';
                r.style.filter = '';
                r.style.pointerEvents = '';
              });
              updateBatchBar();
              errorAlert('网络连接异常，批量删除未完成');
            });
          }
        });
      }
    });
  } else {
    if (confirm('确认删除选中的 ' + selected.length + ' 条记录吗？')) {
      document.getElementById('batchForm').submit();
    }
  }
}

function confirmSingleDelete(actionUrl, detailText, btnEl) {
  const row = btnEl ? btnEl.closest('tr') : null;

  if (typeof Swal !== 'undefined') {
    Swal.fire({
      icon: 'warning',
      iconColor: '#a8475a',
      title: '确认删除？',
      html: detailText + '<br><span style="color:#8a877e;font-size:13px;">删除后提供 5 秒撤销恢复窗口。</span>',
      showCancelButton: true,
      reverseButtons: true,
      confirmButtonText: '确认删除',
      cancelButtonText: '取消',
      buttonsStyling: false,
      customClass: {
        popup: 'app-swal-popup',
        title: 'app-swal-title',
        htmlContainer: 'app-swal-html',
        confirmButton: 'btn-danger-solid',
        cancelButton: 'btn-ghost',
        actions: 'app-swal-actions'
      }
    }).then(function (result) {
      if (result.isConfirmed) {
        if (row) {
          row.style.opacity = '0.35';
          row.style.filter = 'grayscale(1)';
          row.style.pointerEvents = 'none';
        }

        let isUndone = false;
        Swal.fire({
          toast: true,
          position: 'bottom-end',
          icon: 'info',
          title: '已删除 1 条记录',
          html: '<span style="font-size:12px;color:var(--muted)">如需撤回请在 5 秒内点击撤销</span>',
          timer: 5000,
          timerProgressBar: true,
          showConfirmButton: true,
          confirmButtonText: '撤销 (Undo)',
          buttonsStyling: false,
          customClass: {
            popup: 'app-swal-toast app-swal-undo-toast',
            confirmButton: 'btn-primary btn-sm'
          }
        }).then(function(res) {
          if (res.isConfirmed) {
            isUndone = true;
            if (row) {
              row.style.opacity = '';
              row.style.filter = '';
              row.style.pointerEvents = '';
            }
            Swal.fire({
              toast: true,
              position: 'top-end',
              icon: 'success',
              title: '已撤销删除，记录已完整保留',
              showConfirmButton: false,
              timer: 2000
            });
          } else if (res.dismiss === Swal.DismissReason.timer || !isUndone) {
            if (typeof showProgressBar === 'function') showProgressBar();
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '{{ csrf_token() }}';
            fetch(actionUrl, {
              method: 'POST',
              body: new URLSearchParams({ csrf_token: csrfToken }),
              headers: { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json' }
            })
            .then(r => r.json())
            .then(data => {
              if (typeof finishProgressBar === 'function') finishProgressBar();
              if (data.ok) {
                if (row) row.remove();
                updateBatchBar();
                Swal.fire({
                  toast: true,
                  position: 'top-end',
                  icon: 'success',
                  title: data.message || '记录已删除',
                  showConfirmButton: false,
                  timer: 2000,
                  customClass: { popup: 'app-swal-toast' }
                });
              } else {
                if (row) {
                  row.style.opacity = '';
                  row.style.filter = '';
                  row.style.pointerEvents = '';
                }
                errorAlert(data.message || '删除失败');
              }
            })
            .catch(() => {
              if (typeof finishProgressBar === 'function') finishProgressBar();
              if (row) {
                row.style.opacity = '';
                row.style.filter = '';
                row.style.pointerEvents = '';
              }
              errorAlert('网络连接异常，删除未完成');
            });
          }
        });
      }
    });
  } else {
    if (confirm('确认删除吗？')) {
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = actionUrl;
      const csrfInput = document.createElement('input');
      csrfInput.type = 'hidden';
      csrfInput.name = 'csrf_token';
      csrfInput.value = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '{{ csrf_token() }}';
      form.appendChild(csrfInput);
      document.body.appendChild(form);
      form.submit();
    }
  }
}

document.addEventListener('DOMContentLoaded', function() {
  const tbody = document.querySelector('table tbody');
  if (tbody) {
    tbody.addEventListener('click', function(e) {
      // 排除操作列（.actions）或直接点击在 checkbox / 链接 / 按钮 上的情况
      if (e.target.closest('.actions') || e.target.tagName === 'A' || e.target.tagName === 'BUTTON' || e.target.type === 'checkbox') {
        return;
      }
      
      const row = e.target.closest('tr.record-row');
      if (!row) return;

      const checkbox = row.querySelector('.record-checkbox');
      if (checkbox) {
        checkbox.checked = !checkbox.checked;
        updateBatchBar();
      }
    });
  }
});
</script>
{% endblock %}
