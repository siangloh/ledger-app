{% extends layout|default('base.html') %}
{% block title %}编辑记录 - 我的记账本{% endblock %}
{% block content %}
<h2>编辑记录</h2>

<form method="post" action="{{ url_for('edit_record', tx_id=row.id) }}" class="quick-add" id="quickAddForm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row seg-row">
    <label class="seg"><input type="radio" name="type" value="expense" {{ 'checked' if row.type=='expense' }} onchange="onTypeChange()"><span>支出</span></label>
    <label class="seg"><input type="radio" name="type" value="income" {{ 'checked' if row.type=='income' }} onchange="onTypeChange()"><span>收入</span></label>
    <label class="seg"><input type="radio" name="type" value="savings" {{ 'checked' if row.type=='savings' }} onchange="onTypeChange()"><span>储蓄</span></label>
  </div>
  <div class="row seg-row" id="groupRow" style="{{ 'display:flex' if row.type=='income' else 'display:none' }};">
    <label class="seg"><input type="radio" name="group_name" value="main" {{ 'checked' if row.group_name=='main' }} onchange="populateCategories()"><span>主业收入</span></label>
    <label class="seg"><input type="radio" name="group_name" value="side" {{ 'checked' if row.group_name=='side' }} onchange="populateCategories()"><span>副业收入</span></label>
  </div>
  <div class="row" id="fromSavingsRow" style="{{ 'display:flex;' if row.type=='expense' else 'display:none;' }} align-items:center; margin: 4px 0 6px 0;">
    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:var(--gold); user-select:none;">
      <input type="checkbox" name="from_savings" value="1" id="fromSavingsCheck" {{ 'checked' if row.from_savings }} onchange="toggleFromSavingsCategoryBox(this.checked)" style="width:16px; height:16px; accent-color:var(--gold); cursor:pointer;">
      <span>从储蓄中支出（扣除指定储蓄，不扣当月收入结余）</span>
    </label>
  </div>
  <div id="fromSavingsCategoryBox" style="{{ 'display:block;' if (row.type=='expense' and row.from_savings) else 'display:none;' }} margin: 0 0 12px 0; padding: 10px 14px; background: rgba(234, 179, 8, 0.08); border: 1px solid rgba(234, 179, 8, 0.25); border-radius: var(--radius-sm);">
    <label style="font-size: 12px; color: var(--gold); display: block; margin-bottom: 6px; font-weight: 600;">
      从哪项储蓄资金扣除：
    </label>
    <select name="from_savings_category" id="fromSavingsCategorySelect" style="width: 100%; font-size: 13.5px; padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-card); color: var(--text);">
      {% if savings_pool_by_category %}
        {% for scat, samt in savings_pool_by_category.items() %}
          <option value="{{ scat }}" {{ 'selected' if (row.from_savings_category == scat or (not row.from_savings_category and loop.first)) }}>{{ scat }} (结余: {{ samt|money }})</option>
        {% endfor %}
      {% endif %}
      {% for scat in savings_categories %}
        {% if not savings_pool_by_category or scat not in savings_pool_by_category %}
          <option value="{{ scat }}" {{ 'selected' if row.from_savings_category == scat }}>{{ scat }} (结余: RM 0.00)</option>
        {% endif %}
      {% endfor %}
      {% if not savings_pool_by_category and not savings_categories %}
        <option value="默认储蓄">默认储蓄</option>
      {% endif %}
    </select>
  </div>
  <div class="row">
    <label>日期 <input type="date" name="date" value="{{ row.date }}" required></label>
    <label>金额 <input type="number" step="0.01" min="0.01" name="amount" value="{{ row.amount }}" required></label>
  </div>
  <div class="row">
    <label>分类 <select name="category" id="categorySelect" data-preselect="{{ row.category }}"></select></label>
    <label>备注 <input type="text" name="note" value="{{ row.note }}"></label>
  </div>
  <button type="submit" class="btn-primary">保存修改</button>
  <a href="{{ url_for('records') }}" class="btn-cancel" hx-get="{{ url_for('records') }}" hx-target="#mainContainer" hx-swap="innerHTML show:window:top" hx-push-url="true">取消</a>
</form>

<script>
window.CATEGORY_DATA = {
  expense: {{ expense_categories | tojson }},
  income_main: {{ income_categories.main | tojson }},
  income_side: {{ income_categories.side | tojson }},
  savings: {{ savings_categories | tojson }}
};
</script>
{% endblock %}
