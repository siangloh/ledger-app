{% extends layout|default('base.html') %}
{% block title %}{{ t('common.edit') }} - {{ t('nav.brand') }}{% endblock %}
{% block content %}
<h2>{{ t('common.edit') }}</h2>

<form method="post" action="{{ url_for('edit_record', tx_id=row.id) }}" class="quick-add" id="quickAddForm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row seg-row">
    <label class="seg"><input type="radio" name="type" value="expense" {{ 'checked' if row.type=='expense' }} onchange="onTypeChange()"><span>{{ t('common.expense') }}</span></label>
    <label class="seg"><input type="radio" name="type" value="income" {{ 'checked' if row.type=='income' }} onchange="onTypeChange()"><span>{{ t('common.income') }}</span></label>
    <label class="seg"><input type="radio" name="type" value="savings" {{ 'checked' if row.type=='savings' }} onchange="onTypeChange()"><span>{{ t('common.savings') }}</span></label>
  </div>
  <div class="row seg-row" id="groupRow" style="{{ 'display:flex' if row.type=='income' else 'display:none' }};">
    <label class="seg"><input type="radio" name="group_name" value="main" {{ 'checked' if row.group_name=='main' }} onchange="populateCategories()"><span>{{ t('dashboard.main_income') }}</span></label>
    <label class="seg"><input type="radio" name="group_name" value="side" {{ 'checked' if row.group_name=='side' }} onchange="populateCategories()"><span>{{ t('dashboard.side_income') }}</span></label>
  </div>
  <div class="row seg-row" id="expenseSubRow" style="{{ 'display:flex;' if row.type=='expense' else 'display:none;' }}">
    <label class="seg"><input type="radio" name="expense_mode" value="regular" {{ 'checked' if not row.from_savings }} onchange="onExpenseModeChange()"><span>{{ t('dashboard.regular_expense') }}</span></label>
    <label class="seg"><input type="radio" name="expense_mode" value="savings" {{ 'checked' if row.from_savings }} onchange="onExpenseModeChange()"><span>{{ t('dashboard.savings_expense') }}</span></label>
  </div>
  <input type="hidden" name="from_savings" id="fromSavingsInput" value="{{ '1' if row.from_savings else '0' }}">
  <div id="fromSavingsCategoryBox" class="from-savings-box" style="{{ 'display:block;' if (row.type=='expense' and row.from_savings) else 'display:none;' }}">
    <label class="from-savings-label">
      {{ t('dashboard.from_savings_label') }}
    </label>
    <select name="from_savings_category" id="fromSavingsCategorySelect" class="from-savings-select">
      {% if savings_pool_by_category %}
        {% for scat, samt in savings_pool_by_category.items() %}
          <option value="{{ scat }}" {{ 'selected' if (row.from_savings_category == scat or (not row.from_savings_category and loop.first)) }}>{{ scat }} ({{ t('dashboard.balance_prefix') }}: {{ samt|money }})</option>
        {% endfor %}
      {% endif %}
      {% for scat in savings_categories %}
        {% if not savings_pool_by_category or scat not in savings_pool_by_category %}
          <option value="{{ scat }}" {{ 'selected' if row.from_savings_category == scat }}>{{ scat }} ({{ t('dashboard.balance_prefix') }}: RM 0.00)</option>
        {% endif %}
      {% endfor %}
      {% if not savings_pool_by_category and not savings_categories %}
        <option value="默认储蓄">{{ t('dashboard.default_savings') }}</option>
      {% endif %}
    </select>
  </div>
  <div class="row">
    <label>{{ t('common.date') }} <input type="date" name="date" value="{{ row.date }}" required></label>
    <label>{{ t('common.amount') }} <input type="number" step="0.01" min="0.01" name="amount" value="{{ row.amount }}" required></label>
  </div>
  <div class="row">
    <label>{{ t('common.category') }} <select name="category" id="categorySelect" data-preselect="{{ row.category }}"></select></label>
    <label>{{ t('common.note') }} <input type="text" name="note" value="{{ row.note }}"></label>
  </div>
  <div class="row">
    <label style="flex: 1;">{{ t('dashboard.custom_tags') }} <input type="text" name="tags" value="{{ row.tags or '' }}" placeholder="{{ t('dashboard.tags_placeholder') }}"></label>
  </div>
  <button type="submit" class="btn-primary">{{ t('common.save') }}</button>
  <a href="{{ url_for('records') }}" class="btn-cancel" hx-get="{{ url_for('records') }}" hx-target="#mainContainer" hx-swap="innerHTML show:window:top" hx-push-url="true">{{ t('common.cancel') }}</a>
</form>

<script>
window.CATEGORY_DATA = {
  expense: {{ expense_categories | tojson }},
  income_main: {{ income_categories.main | tojson }},
  income_side: {{ income_categories.side | tojson }},
  savings: {{ savings_categories | tojson }}
};
if (typeof onTypeChange === 'function') {
  onTypeChange();
}
</script>
{% endblock %}
