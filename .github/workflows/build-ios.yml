name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'android-companion/shared/**'
      - 'android-companion/iosApp/**'
      - 'android-companion/gradle/**'
      - 'android-companion/build.gradle*'
      - 'android-companion/settings.gradle*'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Shared iOS Simulator Unit Tests
        working-directory: ./android-companion
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :shared:iosSimulatorArm64Test --console=plain 2>&1 | tee iosApp/ios_build_output.txt

      - name: Generate Xcode Project via XcodeGen & Build Unsigned IPA
        working-directory: ./android-companion/iosApp
        run: |
          set -o pipefail
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          if ! xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee ios_build_output.txt; then
            echo "### iOS XcodeBuild Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 ios_build_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LedgerApp.app Payload/
          zip -qr LedgerApp-iOS.ipa Payload

      - name: Run Real XCUITest on iPhone Simulator, Launch App & Capture Screenshot
        working-directory: ./android-companion/iosApp
        run: |
          set -eo pipefail
          SIM_UDID=$(xcrun simctl list devices available iPhone --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime in sorted(data.keys(), reverse=True):
              for d in data[runtime]:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "Using iOS Simulator UDID: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          trap 'xcrun simctl shutdown "$SIM_UDID" || true' EXIT

          xcodebuild test \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build-sim \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee ios_build_output.txt

          SIM_APP="build-sim/Build/Products/Release-iphonesimulator/LedgerApp.app"
          xcrun simctl install "$SIM_UDID" "$SIM_APP"
          xcrun simctl ui "$SIM_UDID" appearance light || true
          mkdir -p ../../scratch
          LAUNCH_OUT=$(xcrun simctl launch --terminate-running-process --stdout="$(pwd)/../../scratch/ios_app_stdout.log" --stderr="$(pwd)/../../scratch/ios_app_stderr.log" "$SIM_UDID" com.siangloh.ledger)
          echo "Launched: $LAUNCH_OUT"
          sleep 5

          ALIVE_LINE=$(xcrun simctl spawn "$SIM_UDID" launchctl list | grep -iE "com\.siangloh\.ledger" || true)
          echo "Process check: ${ALIVE_LINE:-NOT RUNNING}"
          echo "=== App STDOUT ==="
          cat ../../scratch/ios_app_stdout.log 2>/dev/null || true
          echo "=== App STDERR ==="
          cat ../../scratch/ios_app_stderr.log 2>/dev/null || true

          if [ -z "$ALIVE_LINE" ]; then
            echo "ERROR: LedgerApp crashed or exited after launch!"
            LATEST_CRASH=$(ls -t "$HOME/Library/Logs/DiagnosticReports/"*LedgerApp* 2>/dev/null | head -n 1 || true)
            if [ -n "$LATEST_CRASH" ]; then
              echo "=== Crash Report ($LATEST_CRASH) ==="
              head -n 120 "$LATEST_CRASH"
            fi
            exit 1
          fi

          xcrun simctl io "$SIM_UDID" screenshot ios_simulator_boot.png
          ls -lh ios_simulator_boot.png

      - name: Record iOS build failure log
        if: failure()
        run: |
          if [ -f android-companion/iosApp/ios_build_output.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            mkdir -p scratch
            {
              echo "=== Compiler / Test Errors ==="
              grep -nE "^e:|error:|FAILURE:|Execution failed|> Task .* FAILED|XCTest|Test Case .* failed|Assertion Failure" android-companion/iosApp/ios_build_output.txt | head -n 80 || true
              echo "=== Log Tail ==="
              tail -n 120 android-companion/iosApp/ios_build_output.txt
            } > scratch/ios_build_error.log
            git add -f scratch/ios_build_error.log
            git commit -m "ci(ios): record iOS build failure log [skip ci]" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyLedger-iOS-Unsigned-IPA
          path: android-companion/iosApp/LedgerApp-iOS.ipa
          retention-days: 30

      - name: Upload iOS Simulator Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: MyLedger-iOS-Simulator-Screenshot
          path: android-companion/iosApp/ios_simulator_boot.png
          retention-days: 30

      - name: Publish latest iOS Simulator screenshot to repo
        run: |
          set -e
          mkdir -p static/download
          cp android-companion/iosApp/ios_simulator_boot.png static/download/ios_simulator_latest.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- static/download/ios_simulator_latest.png && [ -n "$(git ls-files static/download/ios_simulator_latest.png)" ]; then
            echo "iOS screenshot unchanged, nothing to publish."
          else
            git add static/download/ios_simulator_latest.png
            git commit -m "chore(ios): publish latest iOS simulator screenshot [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
