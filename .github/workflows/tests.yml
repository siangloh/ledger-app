name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint for real errors (syntax errors, undefined names, unused imports)
        run: |
          if ! flake8 . --count --select=E9,F63,F7,F82,F401,F841 --exclude=.git,__pycache__,android-companion,scratch,uploads,static --show-source --statistics > flake8_report.txt 2>&1; then
            cat flake8_report.txt
            echo "### Flake8 Lint Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat flake8_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Record failure log
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p scratch
          cp flake8_report.txt scratch/ci_flake8_error.log || true
          git add scratch/ci_flake8_error.log
          git commit -m "ci: record flake8 failure log" || true
          git push origin main || true

      - name: Run tests
        run: pytest -v
