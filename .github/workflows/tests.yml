name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint for real errors (syntax errors, undefined names, unused imports)
        run: flake8 . --count --select=E9,F63,F7,F82,F401,F841 --show-source --statistics

      - name: Run tests
        run: pytest -v
